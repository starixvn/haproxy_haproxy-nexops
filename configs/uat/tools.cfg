frontend nexops_sentry_fe
    bind *:9009
    mode  http
    option forwardfor
    #acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    #http-request deny if !is-whitelisted-ip
    default_backend sentry_web_uat3_be

backend nexops_nexops_deployment_api_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_deployment_api_ 4 nexops_deployment_api:22222 check resolvers docker init-addr none

backend sentry_web_uat3_be
    option forwardfor
    option http-server-close
    option httpchk GET /account/recover/
    http-check expect status 200
    cookie serverid insert
    server-template nexops_sentry 2 sentry_web_uat3:9000 check resolvers docker init-addr none
    #server-template nexops_sentry 2 sentry_web_uat:9000 check resolvers docker init-addr none

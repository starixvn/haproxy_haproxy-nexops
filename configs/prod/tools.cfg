### Tolgee
backend nexops_tolgee_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nexops_tolgee 1 nexops_tolgee:8080 check resolvers docker init-addr none


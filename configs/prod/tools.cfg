frontend nexops_sentry_fe
    bind *:9009
    mode  http
    option forwardfor
    default_backend nexops_sentry_web_prod_be

frontend nexops_sentry_fe2
    bind *:9000
    mode  http
    option forwardfor
    default_backend nexops_sentry_web_prod_be

backend nexops_sentry_web_prod_be
    option forwardfor
    option http-server-close
    option httpchk GET /account/recover/
    http-check expect status 200
    cookie serverid insert
    server-template sentry_web_prod_ 3 sentry_web_prod:9000 check resolvers docker init-addr none
